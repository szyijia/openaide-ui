name: Build OpenAIDE IDE

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      platform:
        description: '构建平台 (留空则构建全部)'
        required: false
        type: choice
        options:
          - all
          - macos
          - windows
          - linux
        default: all
  # 推送到 main/master 分支或 tag 时触发
  push:
    branches: [main, master]
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  # PR 时触发
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# 同一分支只保留最新的构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.18.2'
  PYTHON_VERSION: '3.11'
  PNPM_VERSION: '9.15.0'
  VSCODIUM_TAG: '1.99.32846'

jobs:
  # ═══════════════════════════════════════
  # macOS 构建 (arm64)
  # ═══════════════════════════════════════
  build-macos:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'macos'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenAIDE IDE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build-desktop.sh macos

      - name: List artifacts
        run: ls -la dist/ || echo "No dist directory"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenAIDE-macOS-${{ matrix.arch }}
          path: |
            dist/*.app
            dist/*.dmg
            dist/*.zip
          retention-days: 30
          if-no-files-found: warn

  # ═══════════════════════════════════════
  # Windows 构建 (x64 + arm64)
  # ═══════════════════════════════════════
  build-windows:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'windows'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenAIDE IDE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCODE_ARCH: ${{ matrix.arch }}
        run: bash scripts/build-desktop.sh windows

      - name: List artifacts
        run: ls -la dist/ || echo "No dist directory"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenAIDE-Windows-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
          retention-days: 30
          if-no-files-found: warn

  # ═══════════════════════════════════════
  # Linux 构建 (x64)
  # ═══════════════════════════════════════
  build-linux:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            libkrb5-dev \
            libx11-dev \
            libxkbfile-dev \
            libsecret-1-dev \
            fakeroot \
            rpm \
            jq

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenAIDE IDE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCODE_ARCH: ${{ matrix.arch }}
        run: bash scripts/build-desktop.sh linux

      - name: List artifacts
        run: ls -la dist/ || echo "No dist directory"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenAIDE-Linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.tar.gz
          retention-days: 30
          if-no-files-found: warn

  # ═══════════════════════════════════════
  # 发布 (仅在 tag 推送时)
  # ═══════════════════════════════════════
  release:
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List all artifacts
        run: find artifacts/ -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
