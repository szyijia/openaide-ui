
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 主渐变：科技蓝到智慧紫 -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C4DFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E040FB;stop-opacity:1" />
    </linearGradient>
    <!-- AI 核心光晕 -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95" />
      <stop offset="40%" style="stop-color:#B388FF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#7C4DFF;stop-opacity:0" />
    </radialGradient>
    <!-- 外发光 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 内核发光 -->
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景（透明） -->

  <!-- 外层：代码尖括号 < > 形成菱形轮廓 -->
  <g filter="url(#glow)">
    <!-- 左尖括号 < -->
    <path d="M 100 256 L 210 146 L 226 166 L 132 256 L 226 346 L 210 366 Z"
          fill="url(#mainGradient)" opacity="0.95"/>
    <!-- 右尖括号 > -->
    <path d="M 412 256 L 302 146 L 286 166 L 380 256 L 286 346 L 302 366 Z"
          fill="url(#mainGradient)" opacity="0.95"/>
  </g>

  <!-- 中层：AI 神经网络连接线 -->
  <g stroke="url(#mainGradient)" stroke-width="2" opacity="0.5" fill="none">
    <!-- 从中心向外辐射的连接线 -->
    <line x1="256" y1="256" x2="190" y2="200" />
    <line x1="256" y1="256" x2="322" y2="200" />
    <line x1="256" y1="256" x2="190" y2="312" />
    <line x1="256" y1="256" x2="322" y2="312" />
    <line x1="256" y1="256" x2="256" y2="180" />
    <line x1="256" y1="256" x2="256" y2="332" />
    <!-- 外层节点之间的连接 -->
    <line x1="190" y1="200" x2="256" y2="180" />
    <line x1="256" y1="180" x2="322" y2="200" />
    <line x1="322" y1="200" x2="322" y2="312" />
    <line x1="322" y1="312" x2="256" y2="332" />
    <line x1="256" y1="332" x2="190" y2="312" />
    <line x1="190" y1="312" x2="190" y2="200" />
  </g>

  <!-- 神经网络外层节点 -->
  <g fill="url(#mainGradient)" opacity="0.7">
    <circle cx="190" cy="200" r="5" />
    <circle cx="322" cy="200" r="5" />
    <circle cx="190" cy="312" r="5" />
    <circle cx="322" cy="312" r="5" />
    <circle cx="256" cy="180" r="5" />
    <circle cx="256" cy="332" r="5" />
  </g>

  <!-- AI 核心：中央发光球体 -->
  <g filter="url(#innerGlow)">
    <circle cx="256" cy="256" r="36" fill="url(#coreGlow)" />
    <circle cx="256" cy="256" r="22" fill="#FFFFFF" opacity="0.9" />
    <circle cx="256" cy="256" r="10" fill="url(#mainGradient)" />
  </g>

  <!-- 装饰：轨道环 -->
  <ellipse cx="256" cy="256" rx="70" ry="26"
           fill="none" stroke="url(#mainGradient)" stroke-width="1.5"
           opacity="0.35" transform="rotate(-30 256 256)" />
  <ellipse cx="256" cy="256" rx="70" ry="26"
           fill="none" stroke="url(#mainGradient)" stroke-width="1.5"
           opacity="0.35" transform="rotate(30 256 256)" />
</svg>
